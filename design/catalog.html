<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог металлопроката · МПС Каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .cat-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; padding: 8px 0 24px; }
  .cat-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cat-filter { position: relative; width: min(360px, 100%); }
  .cat-filter .input { padding-left: 42px; }
  .cat-filter svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--c-muted); }
  .cat-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
  .cat-nav { position: sticky; top: calc(var(--header-h) + 16px); display: grid; gap: 2px; }
  .cat-nav a { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: var(--r-sm); color: var(--c-text); font-size: 14px; font-weight: 500; }
  .cat-nav a:hover { background: var(--c-surface); color: var(--c-primary); }
  .cat-nav a span { color: var(--c-muted); font-variant-numeric: tabular-nums; }
  .cat-groups { display: grid; gap: 16px; }
  .cat-group { background: var(--c-surface); border-radius: var(--r-lg); border: 1px solid var(--c-line-2); padding: 24px; scroll-margin-top: calc(var(--header-h) + 16px); }
  .cat-group-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .cat-group-head h2 { margin: 0; font: 800 20px/1.2 var(--f-head); color: var(--c-ink); }
  .cat-group-head small { color: var(--c-text-2); font-size: 13px; }
  .cat-list { list-style: none; margin: 0; padding: 0; columns: 3 220px; column-gap: 28px; }
  .cat-list li { break-inside: avoid; padding: 5px 0; }
  .cat-list a { color: var(--c-text); font-size: 14.5px; }
  .cat-list a:hover { color: var(--c-primary); }
  .cat-list a.hot { font-weight: 600; color: var(--c-ink); }
  .cat-list a.hot::after { content: "★"; color: var(--c-accent); margin-left: 6px; font-size: 12px; }
  .az { display: grid; gap: 16px; }
  .az-letter { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; background: var(--c-surface); border-radius: var(--r-md); border: 1px solid var(--c-line-2); padding: 18px 22px; }
  .az-letter b { font: 800 28px/1 var(--f-head); color: var(--c-primary); }
  .empty { padding: 48px; text-align: center; color: var(--c-text-2); background: var(--c-surface); border-radius: var(--r-lg); }
  @media (max-width: 900px) { .cat-layout { grid-template-columns: 1fr; } .cat-nav { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; } .cat-nav a { white-space: nowrap; background: var(--c-surface); border: 1px solid var(--c-line-2); } }
</style>
</head>
<body>

<div data-site="header"></div>

<main class="container">
  <nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><span aria-hidden="true">/</span><span>Каталог</span></nav>

  <div class="cat-head">
    <div>
      <div class="caps">Каталог металлопроката</div>
      <h1 class="h1" style="margin-top:8px"><span id="totalCount">130</span> категорий в 10 группах</h1>
    </div>
    <div class="cat-tools">
      <label class="cat-filter">
        <span class="sr-only">Найти категорию</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="catQ" type="search" placeholder="Найти категорию: труба, уголок, лист…" autocomplete="off">
      </label>
      <div class="seg" role="group" aria-label="Вид списка">
        <button type="button" data-view="groups" aria-pressed="true">По группам</button>
        <button type="button" data-view="az" aria-pressed="false">А–Я</button>
      </div>
    </div>
  </div>

  <div class="cat-layout" id="layout">
    <nav class="cat-nav" id="catNav" aria-label="Группы каталога"></nav>
    <div class="cat-groups" id="catGroups"></div>
  </div>
</main>

<div data-site="footer"></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>

const icon = k => `<span class="pico"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${ICONS[k]}</svg></span>`;
const link = (name, hot) => `<a href="${LINKS[name] || '#'}"${hot ? ' class="hot"' : ''}>${name}</a>`;
let view = 'groups';

function render() {
  const q = document.getElementById('catQ').value.trim().toLowerCase();
  const match = n => !q || n.toLowerCase().includes(q);
  const groups = GROUPS.map(g => ({ ...g, list: g.items.filter(match) })).filter(g => g.list.length);
  const total = new Set(GROUPS.flatMap(g => g.items)).size;
  document.getElementById('totalCount').textContent = total;
  const box = document.getElementById('catGroups'), nav = document.getElementById('catNav');
  nav.hidden = view === 'az';
  document.getElementById('layout').style.gridTemplateColumns = view === 'az' ? '1fr' : '';

  if (!groups.length) { box.innerHTML = `<div class="empty">Ничего не нашли по запросу «${q}». Попробуйте <a href="search.html">общий поиск</a> — он ищет и по типоразмерам.</div>`; nav.innerHTML = ''; return; }

  if (view === 'groups') {
    nav.innerHTML = groups.map(g => `<a href="#${g.id}">${g.name}<span>${g.list.length}</span></a>`).join('');
    box.className = 'cat-groups';
    box.innerHTML = groups.map(g => `
      <section class="cat-group" id="${g.id}" aria-labelledby="h-${g.id}">
        <div class="cat-group-head">${icon(g.icon)}<div><h2 id="h-${g.id}">${g.name}</h2><small>${g.list.length} ${q ? 'совпадений' : 'категорий'}</small></div></div>
        <ul class="cat-list">${g.list.map(n => `<li>${link(n, (g.hot || []).includes(n))}</li>`).join('')}</ul>
      </section>`).join('');
  } else {
    const all = [...new Set(groups.flatMap(g => g.list))].sort((a, b) => a.localeCompare(b, 'ru'));
    const byLetter = {};
    all.forEach(n => { const l = n[0].toUpperCase(); (byLetter[l] ||= []).push(n); });
    box.className = 'az';
    box.innerHTML = Object.entries(byLetter).map(([l, list]) => `
      <div class="az-letter"><b>${l}</b><ul class="cat-list">${list.map(n => `<li>${link(n, GROUPS.some(g => (g.hot || []).includes(n)))}</li>`).join('')}</ul></div>`).join('');
  }
}

document.getElementById('catQ').oninput = render;
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
render();
</script>
</body>
</html>
